<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Comptaible" content="IE-edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>HuPfeZi Hof Arbeiten</title>
    <link rel="stylesheet" type="text/css" href="style.css"/>
</head>

  <body>
    <div class="tab">
        <a href="https://www.hupfezihof.at/">
          <img src="Illustrations/Hupfezihof Logo.jpg">
        </a>
        <button class="tablinks" onclick="openTask(event, 'Aufgaben')" id="defaultOpen">Aufgaben</button>
        <button class="tablinks_calender" onclick="openCalender(event, 'Kalender')">Kalender</button>
    </div>

    <div id="Aufgaben" class="tabcontent">
        <input id="myToDo" placeholder="Aufgabe" type="text">
        <button class="button button1" onclick="addTask()">Anlegen</button>
        <hr style="color:black;height:2px;background-color: black;">
        <div id="myTask">
        </div>
    </div>

    <div id="Kalender" class="tabcontent Calender">
      <div class="header">
        <button id="prevBtn">
          <a href="#" class="back">&#8249;</a>
        </button>
        <div class="monthYear" id="monthYear"></div>
        <button id="nextBtn">
          <a href="#" class="next">&#8250;</a>
        </button>
      </div>
      <div class="days">
        <div class="day">Mo</div>
        <div class="day">Di</div>
        <div class="day">Mi</div>
        <div class="day">Do</div>
        <div class="day">Fr</div>
        <div class="day">Sa</div>
        <div class="day">So</div>
      </div>
      <div class="dates" id="dates"></div>
    </div>

    <script src="script.js"></script>

  </body>
</html>
